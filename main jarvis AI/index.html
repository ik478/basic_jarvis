<!DOCTYPE html>
<html>
<head>
    <title>Jarvis Control</title>
</head>
<body>
    <h1>Jarvis Control</h1>

    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>

    <script>
        function connect() {
            fetch('http://127.0.0.1:5000/connect', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                })
                .catch(error => {
                    console.error(error);
                });
        }

        function disconnect() {
            fetch('http://127.0.0.1:5000/disconnect', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                })
                .catch(error => {
                    console.error(error);
                });
        }
    </script>
</body>
</html>
